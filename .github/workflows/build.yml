name: Build/release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release_linux:
    strategy:
      matrix:
        include:
          - os: "ubuntu-latest"
            version: "linux-x64"
          - os: "windows-latest"
            version: "windows-x64"
          - os: "windows-11-arm"
            version: "windows-arm64"
          - os: "macos-latest"
            version: "darwin-arm64"
          - os: "macos-26-intel"
            version: "darwin-x64"

    runs-on: ${{ matrix.os }}
    environment: build
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun build --target=bun-${{ matrix.version }} --trim --compile --format=esm  ./src/index.tsx --outfile ./dist/kratos-${{ matrix.version }}

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: CHANGELOG.md
          token: ${{ secrets.RELEASE_TOKEN }}
