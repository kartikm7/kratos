[changelog]
header = ""
body = """
{% if version %}\
# {{ version | trim_start_matches(pat="v") }}
{{ timestamp | date(format="%d %B, %Y") }}
{% else %}\
# Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
{{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/kartikm7/kratos/pull/{{ commit.remote.pr_number }})){% endif %}\
{% endfor %}
{% endfor %}\
{% if github.contributors | length != 0 %}
🙌 Contributors
{% for contributor in github.contributors %}
- @{{ contributor.username }}\
{% endfor %}
{% endif %}\
{% if version and previous.version %}

Full Changelog: [{{ previous.version }}...{{ version }}](https://github.com/kartikm7/kratos/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->✨ What's New" },
  { message = "^fix", group = "<!-- 1 -->🌊 What's Changed" },
  { message = "^doc", skip = true },
  { message = "^style", skip = true },
  { message = "^refactor", skip = true },
  { message = "^chore", skip = true },
]

[remote.github]
owner = "kartikm7"
repo = "kratos"
